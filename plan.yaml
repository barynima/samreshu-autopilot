    rubric: Вместо «кем хочешь стать»
    level: 2-3
    hook: "7 вопросов за ужином"
    idea: >
      Семь вопросов, которые расскажут о ребёнке больше теста и не звучат как допрос: про то, на что он
      залипает, что объясняет друзьям, чего бы точно не стал делать за деньги и т.п. Последняя карточка —
      как слушать ответ без оценок.
    cta: Сохраните

  - id: pov-mam-ya-podumayu
