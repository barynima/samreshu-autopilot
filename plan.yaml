    rubric: Знакомо?
    level: 1
    hook: "«Мам, я подумаю». Полгода спустя:"
    idea: >
      Сам в той же позе за тем же столом, вокруг меняются времена года за окном (листья, снег). Без слов.
      Подпись: подростку не помогает «подумай», ему помогает конкретный маленький вопрос.
    cta: Отправьте мужу

  - id: ne-test
    date: 2026-10-23
    format: reel_text
    rubric: Мягкая продажа
    level: "3"
    hook: "Мы тоже не верим в тест за 20 минут"
    idea: >
      Надо приносит огромную анкету на 40 вопросов, Сам зевает. Потом Сам пишет в телефон как другу, и
      сам удивляется своим ответам. Подпись: «Сам решу» — разговор, а не тест; анонимно; решает ребёнок;
      мама получает понятный результат: направления и предметы ОГЭ.
    cta: Ссылка в профиле

