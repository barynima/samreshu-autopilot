# Контент-план автопилота по стратегии «Сам и Надо» (документ «Сам и Надо: контент-стратегия автопилота»).
# Автопилот по будням берёт первый пост, которого ещё нет в state.json → done. Порядок важнее дат.
# format: reel_text — нарезка: Сам и Надо в ярких позах + крупная фраза (основной формат); reel_scene — «Сценка» 12–20 с; reel_pov — POV 7–10 с без слов; reel_confess — «Надо признаётся»;
#         carousel — текстовая карусель.
# audience: mom — для мамы (по умолчанию), teen — для подростка.

posts:
  - id: ne-znayu
    date: 2026-10-16
    format: reel_scene
    rubric: Знакомо?
    level: 1-2
    hook: "«Не знаю» на любой вопрос о будущем. Знакомо?"
    idea: >
      Надо сыплет фразами из родительского чата («все уже знают, куда поступают!»), Сам на всё отвечает
      «не знаю». Надо сдувается и признаётся: «я просто боюсь, что он выберет не то». Подпись: не знать
      в 15 нормально; «не знаю» — это непроговорённые интересы; три вопроса вместо «кем хочешь быть».
    cta: Сохраните

  - id: bloger
    date: 2026-10-19
    format: reel_text
    rubric: Профессия, которой вы боитесь
    level: 1-2
    hook: "«Хочу стать блогером»"
    idea: >
      Сам говорит «хочу стать блогером», Надо раздувается в ужасе. Сам показывает, что монтирует ролики
      и пишет сценарии. Подпись: что стоит за желанием (монтаж, сторителлинг, визуал) и какие направления
      рядом. Без цифр заработка и без высмеивания блогеров.
    cta: Подпишитесь

  - id: pov-ne-znayu
    date: 2026-10-20
