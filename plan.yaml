    rubric: Знакомо?
    level: 1
    hook: "POV: вы спросили девятиклассника, кем он хочет стать"
    idea: >
      Сам молча медленно надевает большие наушники и отворачивается к экрану. Без слов. Подпись: это не
      равнодушие, просто «кем хочешь стать» — слишком большой вопрос; вопрос поменьше в подписи.
    cta: Отправьте мужу

