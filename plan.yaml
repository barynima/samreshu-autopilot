# Контент-план автопилота. Каждый день берётся первый эпизод, которого ещё нет в state.json → done.
# Можно дописывать свои эпизоды в конец, менять порядок или удалять — автопилот подхватит.
# audience: school — для школьника, parent — для родителя.

episodes:
  - id: intro
    audience: school
    idea: >
      Знакомство. Сам представляется: «Привет, я Сам». Сзади нависает огромный Надо со стопкой
      бумажек «надо, надо, надо». Сам оборачивается и спрашивает, кто он вообще такой.
      Финал: Надо собирается ответить — обрыв, «завтра расскажу, кто такой Надо».

  - id: desyatyy-klass
    audience: school
    idea: >
      Надо: «Надо в десятый, все идут». Сам: «А зачем мне туда?» Надо сдувается: «Ну... так спокойнее».
      Сам предлагает сначала разобраться, что ему интересно.

  - id: ayti-dengi
    audience: school
    idea: >
      Надо: «Иди в айти, там деньги». Сам: «А если я не люблю сидеть за компом?» Надо достаёт
      телефон «погуглить» и зависает.

  - id: himiya-vrachi
    audience: school
    idea: >
      Надо: «Бери химию на ОГЭ, она для врачей». Сам: «А я хочу во врачи?» Пауза. Надо роняет брошюру.
      Тема: предметы ОГЭ выбирают под направление, а не наоборот.

  - id: ty-v-15-znal
    audience: school
    idea: >
      Надо: «Тебе уже 15, пора знать, кем быть». Сам: «А ты в 15 знал?» Надо краснеет и уменьшается вдвое.

  - id: strah-roditelya
    audience: parent
    idea: >
      Серия для родителей. Надо маленький и тихий. Сам: «Ты чего?» Надо признаётся: «Мне страшно за тебя.
      Вдруг выберешь не то». Мысль для родителя: давление — это тревога, с ней можно договориться.

  - id: sosedkin-syn
    audience: school
    idea: >
      Надо: «У соседки сын уже определился». Сам: «А он счастлив?» Надо: «...я не спрашивал».

  - id: hobbi
    audience: school
    idea: >
      Надо: «Хобби — это не профессия». Сам: «А если из хобби вырастет профессия?» Сам показывает
      свой рисунок / монтаж видео, Надо щурится и задумывается.

  - id: navsegda
    audience: school
    idea: >
      Надо: «Выбрал — значит навсегда». Сам: «А если передумаю?» Надо: «А так можно?» —
      крючок: завтра узнаем, можно ли.

  - id: mozhno-peredumat
    audience: parent
    idea: >
      Продолжение: да, передумать можно. Сам объясняет Надо, что выбор в 9 классе — это направление,
      а не приговор. Для родителей: снижаем страх ошибки.

  - id: slushat-starshih
    audience: school
    idea: >
      Надо: «Надо слушать старших». Сам: «Я слушаю. А можно меня тоже послушают?» Надо садится рядом.

  - id: ne-znayu-chego-hochu
    audience: school
    idea: >
      Сам признаётся: «Я не знаю, кем хочу быть». Надо паникует и раздувается. Сам: «Зато я знаю,
      что мне нравится. Это уже что-то». Показываем, что сервис начинает именно с этого.

  - id: kak-rabotaet
    audience: parent
    idea: >
      Как работает «Сам решу»: Сам разговаривает с сервисом, отвечает на вопросы про то, что нравится,
      получает карту направлений и предметы ОГЭ. Надо заглядывает через плечо и потихоньку успокаивается.
      Без обещаний «профессии мечты».

  - id: sam-reshu
    audience: school
    idea: >
      Надо: «Ладно. Решай сам». Сам: «Сам решу». Надо, уже маленький и светлый, напоминает про
      сроки ОГЭ и держит над Самом зонтик. Финал недели.
