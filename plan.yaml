# Контент-план автопилота по гиду «Сам решу: гид для агента соцсетей».
# Автопилот каждый день берёт первый пост, которого ещё нет в state.json → done. Порядок важнее дат.
# Когда впереди остаётся меньше 4 постов, автопилот сам дописывает неделю по гиду (autopilot/planner.py).
# Раскладка на каждые 7 постов: 3 охватных (уровни 1–2), 2 экспертных (2–3), 2 продающих (3–5).
# format: reel_chat — ролик-переписка: кадры из жизни + сообщения мессенджера (основной формат);
#         reel_kinetic — ролик с оживающим крупным текстом: цифра-счётчик, миф с зачёркиванием, шпаргалка;
#         carousel — карусель 4:5. Старые форматы с игрушечными персонажами (reel_scene, reel_pov, reel_confess) больше не используем.
# reel_chat: первый кадр — диалог мамы и ребёнка («Сам», пол не определяем), дальше 3–4 сообщения от «Сам решу». Подпись пишет голос бренда.
# audience: mom — для мамы (по умолчанию), teen — для подростка.

posts:
  - id: ne-znayu
    date: 2026-10-18
    format: reel_scene
    rubric: Знакомо?
    level: 1-2
    hook: "«Не знаю» на любой вопрос о будущем. Знакомо?"
    idea: >
      Надо сыплет фразами из родительского чата («все уже знают, куда поступают!»), Сам на всё отвечает
      «не знаю». Надо сдувается и признаётся: «я просто боюсь, что он выберет не то». Подпись: не знать
      в 15 нормально; «не знаю» — это непроговорённые интересы; три вопроса вместо «кем хочешь быть».
    cta: Сохраните

