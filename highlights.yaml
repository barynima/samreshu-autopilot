# Сторис для «Актуального». Команда боту: /stories (все) или /stories kak-eto (один хайлайт).
# Каждый хайлайт — мини-журнал: крючок (hero) → узнавание → польза/факты → снятие сомнения → призыв (cta).
# Типы слайдов (autopilot/stories.py): hero, number, myth, list, qa, chat, cta. *Слово* — маркер-выделение.
# hero и chat могут иметь scene — кадр из жизни (на английском). icon — иконка обложки.
# sticker — какой стикер добавить вручную в Instagram (на картинку не попадает).
# Только проверенные факты из strategy/rules.md и от Марины. Без выдуманных отзывов, скриншотов, примеров результата.

highlights:
  - id: kak-eto
    title: Как это
    icon: chat
    stories:
      - type: hero
        scene: "A mom in her early 40s and a teen laughing together on a sofa in a bright modern living room, the teen showing something on a phone, warm daylight, candid moment"
        title: "От «не знаю» до *2–3 направлений* за один вечер"
        sub: "Как «Сам решу» помогает ребёнку понять, что ему интересно"
      - type: chat
        scene: "A teen lying on a bed in a cozy modern bedroom with headphones on, looking at the ceiling, relaxed, daylight"
        messages:
          - {who: mom, text: "Кем хочешь быть?"}
          - {who: sam, text: "Не знаю"}
          - {who: sam, text: "Мам, отстань"}
        sticker: "Опрос: «Это мы» / «У нас иначе»"
      - type: myth
        myth: "Нужен ещё один тест на 40 вопросов"
        truth: "Нужен *разговор*, где не страшно ответить «не знаю»"
      - type: list
        title: "Как это *работает*"
        style: numbers
        items:
          - "Ребёнок открывает samreshu.pro"
          - "Переписывается с ИИ *15–20 минут*, как с другом"
          - "Получает *2–3 направления* и предметы ОГЭ под них"
          - "Вы обсуждаете результат вместе — спокойно, на фактах"
      - type: number
        number: "500 ₽"
        text: "Один раз. *Анонимно* — без имени и телефона"
        note: "Решает ребёнок. У вас — опора для разговора"
      - type: cta
        title: "Попробуйте *сегодня* вечером"
        sub: "15–20 минут — и у разговора о будущем появится начало"
        sticker: "Ссылка на samreshu.pro (поставьте под стрелками)"

  - id: oge
    title: ОГЭ
    icon: calendar
    stories:
      - type: hero
        scene: "A teen doing homework at a bright kitchen table, a mom standing behind with a cup of tea, both looking at a laptop and smiling, evening warm light"
        title: "ОГЭ-2027: *2 даты*, которые решают выбор предметов"
        sub: "Сохраните, чтобы не искать в чате класса"
      - type: list
        title: "Отметьте *в календаре*"
        items:
          - {label: "ФЕВРАЛЬ", text: "Итоговое собеседование по русскому — допуск к ОГЭ"}
          - {label: "ДО 1 МАРТА", text: "Заявление с предметами ОГЭ. Потом поменять сложнее"}
        sticker: "Стикер «Напоминание» или опрос «Уже выбрали / Ещё думаем»"
      - type: myth
        myth: "Берём предметы полегче — главное сдать"
        truth: "Предметы — *первый шаг* к профессии. Сначала направление, потом предметы"
      - type: number
        number: "4,5–4,8"
        text: "средний балл аттестата на *популярные специальности* в сильных колледжах"
        note: "Оценки за ОГЭ идут в аттестат — поэтому выбор предметов важен"
      - type: qa
        q: "А нынешним 8-классникам что-то поменяют?"
        a: "Да: с 1 сентября 2027 года для допуска к ОГЭ понадобится ещё и *устный экзамен по истории*"
        sticker: "Вопрос: «Что непонятно про ОГЭ?»"
      - type: cta
        title: "Не знаете, какие предметы? Начните с *направлений*"
        sub: "«Сам решу» подскажет 2–3 направления и предметы ОГЭ под них"
        sticker: "Ссылка на samreshu.pro (поставьте под стрелками)"

  - id: kolledzh
    title: Колледж
    icon: cap
    stories:
      - type: hero
        scene: "A teen with a backpack walking out of a modern apartment building door into a sunny autumn street, confident, a mom waving from the doorway"
        title: "Колледж или 10 класс? Решает *один вопрос*"
        sub: "И это не «где проще»"
      - type: number
        number: "65%"
        text: "девятиклассников в 2026 году поступили в *колледжи и техникумы*"
        note: "Колледж — нормальный путь. Если выбран осознанно"
      - type: chat
        scene: "A mom and a teen talking in a bright modern kitchen, the teen leaning on the counter, both relaxed and smiling"
        messages:
          - {who: mom, text: "Ну что, 10 класс или колледж?"}
          - {who: sam, text: "Колледж. Лишь бы не ЕГЭ"}
          - {who: brand, text: "Это не каприз. Следующий вопрос: *какая специальность?*"}
      - type: myth
        myth: "Не сдаст — пойдёт в колледж на всякий случай"
        truth: "В некоторые техникумы *до 18 человек* на место"
      - type: list
        title: "3 вопроса *до выбора*"
        style: numbers
        items:
          - "Какая *специальность* интересна?"
          - "Какой путь к ней *короче*: колледж или 10 класс?"
          - "Хватит ли *баллов* аттестата?"
        sticker: "Надпись «Сохраните»"
      - type: cta
        title: "Не знаете специальность? Начните с *направлений*"
        sub: "«Сам решу» поможет найти 2–3 за один вечер"
        sticker: "Ссылка на samreshu.pro (поставьте под стрелками)"

  - id: dannye
    title: Данные
    icon: lock
    stories:
      - type: hero
        scene: "A teen sitting cross-legged on a bed in a cozy bright bedroom, typing on a phone with a calm private smile, soft daylight"
        title: "Имя и телефон ребёнка? *Не спрашиваем*"
        sub: "Почему анонимность — это не мелочь"
      - type: list
        title: "Что с ответами *ребёнка*"
        items:
          - "Без имени и телефона: разговор *анонимный*"
          - "История хранится только *на вашем устройстве*"
          - "Мы не храним разговор и *не читаем* его"
          - "Сообщения на ходу обрабатывает ИИ — только чтобы вести беседу"
      - type: qa
        q: "Зачем вообще анонимно?"
        a: "Так ребёнок *честнее*: чат не оценивает, не обижается и не расскажет учителю"
      - type: cta
        title: "Остались вопросы о данных? *Спросите*"
        sub: "Ответим честно — и добавим сюда ответ для всех"
        sticker: "Вопрос: «Что важно знать о данных?»"

  - id: voprosy
    title: Вопросы
    icon: question
    stories:
      - type: hero
        scene: "A mom in her early 40s sitting at a cafe-style kitchen table with a phone and a cup of coffee, thoughtful but relaxed, bright modern interior"
        title: "5 вопросов, которые мамы задают *первыми*"
        sub: "Честные ответы — даже про то, кому мы не подойдём"
      - type: qa
        q: "Сколько стоит и сколько длится?"
        a: "*500 ₽* один раз. *15–20 минут* — ребёнок проходит сам, когда удобно"
      - type: qa
        q: "А если он на всё скажет «не знаю»?"
        a: "Это нормально. Чат задаёт вопросы *поменьше* — и ответы находятся"
      - type: qa
        q: "Вы выберете ребёнку профессию?"
        a: "Нет. Будут *2–3 направления* и предметы ОГЭ. Решает сам ребёнок"
      - type: qa
        q: "Кому не подойдёт?"
        a: "Если ребёнок уже точно знает, куда идёт, — нам почти нечего добавить. Это *опора для разговора*, а не диагноз"
      - type: cta
        title: "Есть свой вопрос? *Задайте*"
        sub: "Самые частые ответы добавим в этот раздел"
        sticker: "Вопрос + ссылка на samreshu.pro"

  - id: kto-ya
    title: Кто я
    icon: person
    # ЧЕРНОВИК: перепишите своими словами. Перед этими сторис выложите своё фото или видео-селфи.
    stories:
      - type: qa
        q: "Я Марина. И профессию в школе я выбрала *неудачно*"
        a: "Хотела быть врачом или учителем. Стала инженером — «компромисс»"
      - type: myth
        myth: "Выбирай, где платят и куда возьмут"
        truth: "Выбирать надо по тому, что *нравится*. Это я поняла поздно"
      - type: qa
        q: "Первым «Сам решу» прошёл *мой сын*"
        a: "И заинтересовался IT-аналитикой — о ней он раньше даже не думал"
      - type: cta
        title: "Хочу, чтобы ваш ребёнок выбрал *своё*"
        sub: "Попробуйте «Сам решу»"
        sticker: "Ссылка на samreshu.pro"
