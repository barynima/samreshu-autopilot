# Сторис для «Актуального». Команда боту: /stories (все) или /stories chto-eto (один хайлайт).
# scene — что нарисовать (на английском, персонажи по эталонам); без scene — сторис только с текстом.
# bg — фон текстовой сторис: coral или cream. text — текст на сторис (до ~15 слов, \n — новая строка).
# sticker — подсказка, какой стикер добавить вручную в Instagram (на картинку не попадает).
# Сам — без рода: не пишем «он», пишем «ребёнок».
# «Как это работает» и «Отзывы» здесь нет: нужны настоящие скриншоты и настоящие отзывы.

highlights:
  - id: chto-eto
    title: Что это
    stories:
      - scene: "Sam sits behind a half-open bedroom door wearing big headphones, looking away; cozy dim room"
        text: "«Кем хочешь быть?» — «Не знаю».\nЗнакомо?"
        sticker: "Опрос: «Да, это мы» / «У нас иначе»"
      - bg: coral
        text: "Это не тест на 40 вопросов.\nЭто разговор с ИИ на языке школьника. Чату не страшно сказать «не знаю»"
      - scene: "Sam sitting at a laptop with a glowing screen, curious glowing eyes, a small calm light-blue Nado peeking from behind"
        text: "15–20 минут.\nНа выходе — 2–3 направления и какие предметы ОГЭ под них брать"
      - scene: "Sam waving hello cheerfully, a small calm light-blue Nado next to Sam waving too"
        text: "500 ₽. Анонимно: без имени и телефона"
        sticker: "Ссылка на samreshu.pro"

  - id: kto-ya
    title: Кто я
    # ЧЕРНОВИК: перепишите своими словами. Перед этими сторис выложите своё фото или видео-селфи.
    stories:
      - bg: cream
        text: "Я Марина. Инженер по диплому — и профессию в школе выбрала неудачно"
      - bg: cream
        text: "Хотела быть врачом или учителем. Выбрала «компромисс».\nТеперь знаю: выбирать надо по тому, что нравится"
      - bg: coral
        text: "Первым «Сам решу» прошёл мой сын. И заинтересовался IT-аналитикой — о ней он раньше даже не думал"
        sticker: "Ссылка на samreshu.pro"

  - id: roditelyam
    title: Родителям
    stories:
      - scene: "Small light-blue Nado sitting alone on a sofa, hugging a pillow, slightly worried"
        text: "Переживаете за выбор больше, чем ребёнок?\nВы не одна"
        sticker: "Опрос: что сложнее — начать разговор / не поругаться"
      - bg: coral
        text: "Вместо «Кем хочешь стать?» спросите за ужином:"
      - bg: cream
        text: "1. Что тебе сейчас интересно, даже если кажется ерундой?\n2. На каком уроке время летит быстрее?\n3. Что у тебя получается легче, чем у других?"
        sticker: "Надпись «Сделайте скриншот»"
      - scene: "Sam and a small calm light-blue Nado sitting together on a sofa, peaceful, warm light"
        text: "Не давить и не бросать.\nРебёнок разбирается сам, вы — рядом"
        sticker: "Ссылка на samreshu.pro"

  - id: oge
    title: ОГЭ-2027
    stories:
      - scene: "Sam thinking with a hand on the chin, a big wall calendar behind, no text on the calendar"
        text: "Предметы ОГЭ выбрали, потому что «все так выбрали»?"
        sticker: "Опрос: «Уже выбрали» / «Ещё думаем»"
      - bg: coral
        text: "Заявление с предметами — до 1 марта.\nИтоговое собеседование — в феврале.\nВремени меньше, чем кажется"
      - scene: "Sam holding a school certificate folder, looking at it seriously"
        text: "Оценки за ОГЭ влияют на аттестат.\nА в колледж берут по среднему баллу аттестата"
      - scene: "Sam at a fork in a path choosing a direction, hopeful, soft colors"
        text: "Поэтому сначала 2–3 направления — потом предметы. Не наоборот"
        sticker: "Ссылка на samreshu.pro"
      - scene: "Nado surprised with wide eyes, holding a small history book"
        text: "Нынешним 8-классникам: с 2027/28 учебного года для допуска к ОГЭ — ещё и устная история"
        sticker: "Вопрос: «Что непонятно про ОГЭ?»"
