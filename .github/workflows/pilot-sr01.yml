name: Pilot SR01 — review only
on:
  push:
    branches: ["codex/pilot-sr01-budget"]
    paths: [".github/workflows/pilot-sr01.yml"]
permissions:
  contents: read
concurrency:
  group: pilot-sr01-single-run
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Generate approved pilot; no publication
        run: python -u -m scripts.pilot_sr01
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_PROJECT_ID: ${{ vars.GOOGLE_PROJECT_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ vars.TG_CHAT_ID }}
      - name: Preserve completed stages and spend reservations even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot-SR-PILOT-01-v1
          path: pilot-output/
          retention-days: 30
