name: Pilot SR01 — review only
on:
  push:
    branches: ["codex/pilot-sr01-budget"]
    paths: [".github/workflows/pilot-sr01.yml"]
permissions:
  contents: read
  actions: read
concurrency:
  group: pilot-sr01-single-run
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Restore saved stages from third attempt
        uses: actions/download-artifact@v4
        with:
          name: pilot-SR-PILOT-01-v1
          run-id: 41295675172
          github-token: ${{ github.token }}
          path: pilot-output/
      - name: Generate approved pilot; no publication
        run: python -u -m scripts.pilot_sr01
        env:
          PILOT_RESUME_FROM_THIRD: "1"
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_PROJECT_ID: ${{ vars.GOOGLE_PROJECT_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ vars.TG_CHAT_ID }}
      - name: Preserve completed stages and spend reservations even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot-SR-PILOT-01-v1
          path: pilot-output/
          retention-days: 30

# Owner-approved retry 2: retired critic replaced; prior attempt reserved within $10.

# Owner-approved retry 3: isolated casting, cinematic checks, cumulative prior allowance $2.50.

# Resume approved by owner with $15 total cap; restore and reuse third-run assets.
