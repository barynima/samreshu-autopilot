name: Кнопки из Telegram (бот на связи 30 минут)

on:
  schedule:
    - cron: "13 5-19/2 * * *"   # запасная проверка раз в 2 часа днём; GitHub может пропускать такие запуски
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Git identity
        run: |
          git config user.name "samreshu-autopilot"
          git config user.email "autopilot@users.noreply.github.com"
      - name: Run
        run: python -m autopilot.main poll
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ vars.TG_CHAT_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_PROJECT_ID: ${{ vars.GOOGLE_PROJECT_ID }}
          IMAGE_MODEL: ${{ vars.IMAGE_MODEL }}
          GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL }}
          CLOUDRU_BASE_URL: ${{ vars.CLOUDRU_BASE_URL }}
          CLOUDRU_API_KEY: ${{ secrets.CLOUDRU_API_KEY }}
          TEXT_MODEL: ${{ vars.TEXT_MODEL }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH }}
          VIDEO_MODE: ${{ vars.VIDEO_MODE }}
          VOICES: ${{ vars.VOICES }}
          VEO_MODEL: ${{ vars.VEO_MODEL }}
          SESSION_MINUTES: ${{ github.event_name == 'schedule' && '15' || '30' }}
