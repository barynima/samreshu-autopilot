name: Проверка конструктора без генерации и публикации
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Собрать карусель и мини-фильм из тестовых данных
        run: python smoke_constructor.py
        env:
          ONLY_FORMATS: carousel,reel_story
