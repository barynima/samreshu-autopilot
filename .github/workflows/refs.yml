name: Эталоны персонажей

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Git identity
        run: |
          git config user.name "samreshu-autopilot"
          git config user.email "autopilot@users.noreply.github.com"
      - name: Run
        run: python -m autopilot.main refs
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ vars.TG_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IMAGE_MODEL: ${{ vars.IMAGE_MODEL }}
          GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL }}
          CLOUDRU_BASE_URL: ${{ vars.CLOUDRU_BASE_URL }}
          CLOUDRU_API_KEY: ${{ secrets.CLOUDRU_API_KEY }}
          TEXT_MODEL: ${{ vars.TEXT_MODEL }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH }}
